<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top 10 Arduino Capstone Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      function toggleModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
          modal.classList.toggle("hidden");
          modal.classList.toggle("flex");
        }
      }
    </script>
  </head>
  <body class="bg-gray-900 text-white font-sans">
    <header class="text-center py-10">
      <h1 class="text-5xl font-extrabold text-cyan-400 mb-4">Top 10 Arduino Capstone Projects</h1>
      <p class="text-lg text-gray-400">Click an image to view description, how it works, tech stack, and code sample</p>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-6 pb-20 max-w-7xl mx-auto" id="project-grid"></main>

    <footer class="text-center text-gray-400 py-6 border-t border-gray-700">
      &copy; 2025 Arduino Project Showcase. All rights reserved.
    </footer>

    <script>
      const projects = [
        {
          title: "Smart Trash Bin (Auto Lid)",
          description: "Uses ultrasonic sensor and servo motor to open the lid automatically.",
          stack: ["Ultrasonic Sensor", "Servo", "Arduino Uno"],
          image: "assets/img/1.png",
          code: `#include <Servo.h>
Servo servo;
int trigPin = 9;
int echoPin = 10;
long duration;
int distance;

void setup() {
  servo.attach(3);
  pinMode(trigPin, OUTPUT);
  pinMode(echoPin, INPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(trigPin, LOW);
  delayMicroseconds(2);
  digitalWrite(trigPin, HIGH);
  delayMicroseconds(10);
  digitalWrite(trigPin, LOW);
  duration = pulseIn(echoPin, HIGH);
  distance = duration * 0.034 / 2;

  if (distance < 10) {
    servo.write(90);
    delay(2000);
    servo.write(0);
  }
  delay(500);
}`
        },
        {
          title: "Alcohol Detection System",
          description: "Detects alcohol using MQ3 sensor and blocks ignition via relay.",
          stack: ["MQ3 Sensor", "Relay", "Arduino Uno"],
          image: "assets/img/2.png",
          code: `int sensorPin = A0;
int relayPin = 8;

void setup() {
  pinMode(sensorPin, INPUT);
  pinMode(relayPin, OUTPUT);
}

void loop() {
  int value = analogRead(sensorPin);
  if (value > 400) {
    digitalWrite(relayPin, LOW);
  } else {
    digitalWrite(relayPin, HIGH);
  }
}`
        },
        {
          title: "Automatic Plant Watering",
          description: "Waters plant based on soil moisture sensor readings.",
          stack: ["Soil Sensor", "Pump", "Arduino Uno"],
          image: "assets/img/3.png",
          code: `int soil = A0;
int pump = 7;

void setup() {
  pinMode(pump, OUTPUT);
}

void loop() {
  int val = analogRead(soil);
  if (val < 300) {
    digitalWrite(pump, HIGH);
    delay(5000);
    digitalWrite(pump, LOW);
  }
  delay(1000);
}`

  pinMode(8, OUTPUT);

}`

          image: "assets/img/7.png",

        {

          stack: ["Flame Sensor", "Buzzer", "GSM"],

          title: "Weather Monitoring System",
          description: "Tracks temperature and humidity using DHT11 sensor.",
          stack: ["DHT11", "LCD", "Arduino Uno"],
          image: "assets/img/9.png",

      const container = document.getElementById("project-grid");

</html>
